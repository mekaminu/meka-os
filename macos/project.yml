# XcodeGen spec (ADR-011). Generate with: xcodegen generate --spec macos/project.yml
name: MekaOS
options:
  bundleIdPrefix: os.meka
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  # Spike S6 (ADR-002): Zetetic's official SQLCipher package (BSD-style licence, docs/third-party-notices.md). Its
  # dynamic SQLCipher.framework replaces the system libsqlite3 for MekaKit's SQLDelight/SQLiter driver.
  SQLCipher:
    url: https://github.com/sqlcipher/SQLCipher.swift
    exactVersion: 4.19.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode 26 new-project defaults: main-actor by default + approachable concurrency, so Kotlin (non-Sendable)
    # types imported with @preconcurrency are usable from SwiftUI without data-race diagnostics.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_HARDENED_RUNTIME: YES       # required for notarisation (ADR-010)
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    MEKA_SYNC_URL: https://d2o7ogpu114nmw.cloudfront.net   # dev sync server; pre-fills Connect
targets:
  MekaOS:
    type: application
    scheme:
      testTargets: [MekaOSTests]
    platform: macOS
    sources:
      - path: MekaOS
      - path: NewsWidgetShared   # also compiled into the widget (DeskNewsSnapshot)
    info:
      path: MekaOS/Info.plist
      properties:
        CFBundleDisplayName: Meka
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        MekaSyncURL: $(MEKA_SYNC_URL)
        # Talk to MEKA (V1 voice slice 3): speech is recognised on the Mac only; nothing is recorded or sent away.
        NSMicrophoneUsageDescription: MEKA listens while you talk to it. Your voice is turned into words on this Mac and never recorded or sent away.
        NSSpeechRecognitionUsageDescription: MEKA turns what you say into words on this Mac only, so you can talk to it. Nothing is sent to Apple or kept.
        # Self-updating phone app: tools/publish-fold.sh opens mekaos://publish-fold-update?apk=… (FoldUpdateSheet).
        CFBundleURLTypes:
          - CFBundleURLName: os.meka.mac.publish
            CFBundleURLSchemes: [mekaos]
        # Capture from anywhere: select text in any app → Services → "Add to MEKA" (CaptureService.swift).
        NSServices:
          - NSMenuItem:
              default: Add to MEKA
            NSMessage: captureText
            NSPortName: $(PRODUCT_NAME)
            NSRequiredContext: {}
            NSSendTypes: [public.utf8-plain-text]
    entitlements:
      path: MekaOS/MekaOS.entitlements
      properties:
        # Not sandboxed for Developer ID (ADR-010), but only sandbox-compatible APIs are used.
        com.apple.security.network.client: true
        # Talk to MEKA: the hardened runtime needs this for the microphone.
        com.apple.security.device.audio-input: true
    dependencies:
      - framework: ../core/facade/build/XCFrameworks/release/MekaKit.xcframework
        embed: false
      - package: SQLCipher   # dynamic, embedded and signed with the app; must be the only sqlite3 the app links
      # The desktop News widget (news ticker slice 3b), embedded in Contents/PlugIns.
      - target: MekaNewsWidget
    preBuildScripts:
      - name: Build MekaKit XCFramework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :core:facade:assembleMekaKitReleaseXCFramework --quiet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: os.meka.mac
        # No -lsqlite3: MekaKit's sqlite3_* calls bind to SQLCipher (spike S6). MekaCoreBridgeTests checks it.
  # The Mac's desktop News widget (build plan M1, news ticker slice 3b). Sandboxed, as WidgetKit requires; it never
  # links the core: it reads only the snapshot MEKA writes to ~/Library/Application Support/MekaOS/NewsWidget/ (a
  # read-only sandbox exception for that one folder; no app group, which needs the Apple Developer Program).
  MekaNewsWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: NewsWidget
      - path: NewsWidgetShared
      - path: MekaOS/DesignSystem/MekaTokens.swift
    info:
      path: NewsWidget/Info.plist
      properties:
        CFBundleDisplayName: MEKA News
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NewsWidget/NewsWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/MekaOS/NewsWidget/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: os.meka.mac.news-widget
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated   # WidgetKit's provider runs off the main actor
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
  MekaOSTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MekaOSTests]
    dependencies:
      - target: MekaOS
      # Visible to `import MekaKit` but not linked twice (the static framework is already in the host app).
      - framework: ../core/facade/build/XCFrameworks/release/MekaKit.xcframework
        link: false
        embed: false
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated   # XCTestCase initialisers are nonisolated
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MekaOS.app/Contents/MacOS/MekaOS
