# XcodeGen spec (ADR-011). Generate with: xcodegen generate --spec macos/project.yml
name: MekaOS
options:
  bundleIdPrefix: os.meka
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode 26 new-project defaults: main-actor by default + approachable concurrency, so Kotlin (non-Sendable)
    # types imported with @preconcurrency are usable from SwiftUI without data-race diagnostics.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_HARDENED_RUNTIME: YES       # required for notarisation (ADR-010)
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
targets:
  MekaOS:
    type: application
    scheme:
      testTargets: [MekaOSTests]
    platform: macOS
    sources:
      - path: MekaOS
    info:
      path: MekaOS/Info.plist
      properties:
        CFBundleDisplayName: Meka
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        MekaSyncURL: $(MEKA_SYNC_URL)
    entitlements:
      path: MekaOS/MekaOS.entitlements
      properties:
        # Not sandboxed for Developer ID (ADR-010), but only sandbox-compatible APIs are used.
        com.apple.security.network.client: true
    dependencies:
      - framework: ../core/facade/build/XCFrameworks/release/MekaKit.xcframework
        embed: false
    preBuildScripts:
      - name: Build MekaKit XCFramework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :core:facade:assembleMekaKitReleaseXCFramework --quiet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: os.meka.mac
        OTHER_LDFLAGS: ["-lsqlite3"]   # replaced by SQLCipher linkage in spike S6
  MekaOSTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MekaOSTests]
    dependencies:
      - target: MekaOS
      # Visible to `import MekaKit` but not linked twice (the static framework is already in the host app).
      - framework: ../core/facade/build/XCFrameworks/release/MekaKit.xcframework
        link: false
        embed: false
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated   # XCTestCase initialisers are nonisolated
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MekaOS.app/Contents/MacOS/MekaOS
