<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.in{animation:fadeup .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.sh{animation:sheet .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.pop{animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
button{cursor:pointer;font-family:DM Sans,sans-serif}
input{font-family:DM Sans,sans-serif}
input::placeholder{color:#6f6a62}
@media (prefers-reduced-motion:reduce){.in,.sh,.pop{animation:none}}
</style>
</helmet>
<div style="width:390px;height:1000px;box-sizing:border-box;background:#000;color:#ededed;font-family:DM Sans,system-ui,sans-serif;display:flex;flex-direction:column;position:relative;overflow:hidden">

<div style="padding:16px 16px 10px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;justify-content:space-between;align-items:flex-start">
<div style="display:flex;flex-direction:column;gap:2px"><div style="font-size:28px;font-weight:700">Sunday</div><div style="font-size:15px;color:#8f897f">8 November</div></div>
<div style="display:flex;gap:8px;align-items:center">
<button type="button" onClick="{{toggleTimes}}" style="{{timesBtn}}">{{timesLabel}}</button>
<span style="background:#24231b;color:#e3d3a6;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:600">{{total}}</span>
</div>
</div>
<div style="height:6px;border-radius:3px;background:#1d1d20;overflow:hidden"><div style="{{progress}}"></div></div>
<div style="display:flex;justify-content:space-between;font-size:12.5px;color:#8f897f"><span>{{doneLine}}</span><span>{{freeLine}}</span></div>
</div>

<div style="flex:1;overflow:auto;padding:0 16px;display:flex;flex-direction:column">
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="5">
<div class="in" style="display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #141416">
<button type="button" onClick="{{t.tick}}" aria-label="Done" style="width:44px;height:44px;margin:-10px -10px -10px -12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span class="{{t.tickClass}}" style="{{t.tickStyle}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></button>
<button type="button" onClick="{{t.open}}" style="flex:1;border:0;background:transparent;color:#ededed;text-align:left;padding:0;display:flex;flex-direction:column;gap:3px;min-width:0">
<sc-if value="{{t.showTime}}" hint-placeholder-val="{{true}}"><span style="font-size:12.5px;color:#a8a29a;font-weight:500">{{t.time}}</span></sc-if>
<span style="{{t.titleStyle}}">{{t.title}}</span>
<span style="display:flex;gap:6px;align-items:center;font-size:12px;color:#8f897f"><span style="{{t.dot}}"></span>{{t.area}}</span>
</button>
<span style="background:#1a1a1d;color:#d8d2c6;border-radius:8px;padding:5px 8px;font-size:12.5px;flex-shrink:0">{{t.len}}</span>
</div>
</sc-for>
<div style="font-size:12px;color:#6f6a62;padding:14px 0">Type one after another · “30m”, “9:00”, “#work” work in the text · paste a list for many at once · hold and drag to reorder</div>
</div>

<div style="padding:10px 12px 16px;background:linear-gradient(transparent,#000 30%);display:flex;flex-direction:column;gap:8px">
<sc-if value="{{toast}}" hint-placeholder-val="{{false}}"><div class="in" style="background:#2a2721;color:#f0e6cf;border-radius:12px;padding:10px 12px;font-size:13px">{{toast}}</div></sc-if>
<div style="display:flex;gap:8px;align-items:center;background:#151517;border-radius:16px;padding:6px 6px 6px 14px">
<label for="add" style="position:absolute;left:-9999px">New task</label>
<input id="add" value="{{draft}}" onInput="{{type}}" onKeyDown="{{enter}}" placeholder="Add a task · Enter for the next" style="flex:1;border:0;background:transparent;color:#ededed;font-size:15px;outline:none;min-width:0;height:40px">
<button type="button" onClick="{{add}}" aria-label="Add task" style="width:40px;height:40px;border-radius:12px;border:0;background:#c9b37e;color:#111;font-size:22px;font-weight:600">+</button>
</div>
<div style="display:flex;gap:6px">
<button type="button" onClick="{{paste}}" style="flex:1;border:0;background:#121214;color:#d8d2c6;border-radius:10px;height:36px;font-size:12.5px">Paste a list</button>
<button type="button" onClick="{{plan}}" style="flex:1;border:0;background:#121214;color:#d8d2c6;border-radius:10px;height:36px;font-size:12.5px">Fit times from 9:00</button>
<button type="button" style="flex:1;border:0;background:#121214;color:#d8d2c6;border-radius:10px;height:36px;font-size:12.5px">Say them</button>
</div>
</div>

<sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end">
<div class="sh" style="width:100%;background:#151517;border-radius:22px 22px 0 0;padding:12px 16px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px">
<div style="width:40px;height:4px;border-radius:2px;background:#3a3a3e;align-self:center"></div>
<div style="font-size:19px;font-weight:600">{{sheet.title}}</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<div style="background:#1d1d20;border-radius:12px;padding:8px 10px"><div style="font-size:10px;letter-spacing:.12em;color:#a8a29a">TIME</div><div style="font-size:14px;font-weight:600;margin-top:2px">{{sheet.time}}</div></div>
<div style="background:#1d1d20;border-radius:12px;padding:8px 10px"><div style="font-size:10px;letter-spacing:.12em;color:#a8a29a">LENGTH</div><div style="font-size:14px;font-weight:600;margin-top:2px">{{sheet.len}}</div></div>
<div style="background:#1d1d20;border-radius:12px;padding:8px 10px"><div style="font-size:10px;letter-spacing:.12em;color:#a8a29a">AREA</div><div style="font-size:14px;font-weight:600;margin-top:2px">{{sheet.area}}</div></div>
</div>
<div style="font-size:11px;letter-spacing:.14em;color:#a8a29a">MOVE TO</div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
<sc-for list="{{moves}}" as="m" hint-placeholder-count="4"><button type="button" onClick="{{m.go}}" style="border:0;background:#1d1d20;color:#ededed;border-radius:14px;height:52px;font-size:13.5px;font-weight:500">{{m.name}}</button></sc-for>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
<sc-for list="{{actions}}" as="a" hint-placeholder-count="6"><button type="button" onClick="{{a.go}}" style="border:0;background:#1a1a1d;color:#ededed;border-radius:12px;height:46px;font-size:13.5px;text-align:left;padding:0 12px">{{a.name}}</button></sc-for>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
<button type="button" onClick="{{sheetDel}}" style="border:0;background:transparent;color:#e07a6b;border-radius:12px;height:44px;font-size:14px">Delete</button>
<button type="button" onClick="{{sheetClose}}" style="border:0;background:#c9b37e;color:#111;border-radius:12px;height:44px;font-size:14px;font-weight:600">Done</button>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
constructor(p){super(p);this.state={times:true,draft:'',open:null,toast:'',n:5,
tasks:[{id:1,title:'Complete feedbacks',len:30,area:'Work',done:false},{id:2,title:'Review plan for DL',len:30,area:'Work',done:false},{id:3,title:'Book the MOT',len:15,area:'Car',done:true},{id:4,title:'Call the school about Friday',len:15,area:'Kids',done:false}]};}
renderVals(){
var s=this.state,self=this;
var colors={Work:'#8a9bd1',Car:'#d9a35b',Kids:'#7fb3a8',Home:'#b48ad1',Personal:'#c9b37e'};
var fmt=function(m){return Math.floor(m/60)+':'+String(m%60).padStart(2,'0');};
var clock=9*60;
var list=s.tasks.map(function(t){var start=clock;clock+=t.len;return {t:t,start:start};});
var total=s.tasks.reduce(function(a,t){return a+t.len;},0);
var done=s.tasks.filter(function(t){return t.done;});
var doneMin=done.reduce(function(a,t){return a+t.len;},0);
var parse=function(text,id){var len=30,area='Personal',title=text;
 var m=title.match(/(\d+)\s*(m|min|h)\b/i);if(m){len=m[2].toLowerCase()==='h'?Number(m[1])*60:Number(m[1]);title=title.replace(m[0],'');}
 var h=title.match(/#(\w+)/);if(h){area=h[1].charAt(0).toUpperCase()+h[1].slice(1);title=title.replace(h[0],'');}
 title=title.replace(/\b\d{1,2}:\d{2}\b/,'').trim();return {id:id,title:title||text,len:len,area:area,done:false};};
var addText=function(text){var t=(text||'').trim();if(!t)return;var n=s.n+1;self.setState({tasks:s.tasks.concat([parse(t,n)]),n:n,draft:'',toast:''});};
var cur=s.open?s.tasks.filter(function(t){return t.id===s.open;})[0]:null;
var curStart=cur?list.filter(function(x){return x.t.id===cur.id;})[0].start:0;
var leave=function(msg){self.setState({tasks:s.tasks.filter(function(t){return t.id!==s.open;}),open:null,toast:msg});};
return {
total:fmt(total),
timesLabel:s.times?'Times on':'Times off',
timesBtn:'border:0;border-radius:10px;padding:8px 10px;font-size:12.5px;'+(s.times?'background:#2a2721;color:#f0e6cf':'background:#1d1d20;color:#a8a29a'),
toggleTimes:function(){self.setState({times:!s.times});},
progress:'height:100%;border-radius:3px;background:#c9b37e;transition:width .4s;width:'+(total?Math.round(doneMin/total*100):0)+'%',
doneLine:done.length+' of '+s.tasks.length+' done',
freeLine:'ends about '+fmt(9*60+total),
tasks:list.map(function(x){var t=x.t;return {title:t.title,area:t.area,len:fmt(t.len),time:fmt(x.start),showTime:s.times,
 dot:'width:7px;height:7px;border-radius:4px;background:'+(colors[t.area]||'#a8a29a'),
 titleStyle:'font-size:16px;line-height:1.3;'+(t.done?'color:#6f6a62;text-decoration:line-through':''),
 tickClass:t.done?'pop':'',
 tickStyle:'width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;'+(t.done?'background:#c9b37e;color:#111':'border:1.5px solid #5a5650;color:transparent'),
 tick:function(){self.setState({tasks:s.tasks.map(function(y){return y.id===t.id?Object.assign({},y,{done:!y.done}):y;})});},
 open:function(){self.setState({open:t.id,toast:''});}};}),
draft:s.draft,
type:function(e){self.setState({draft:e.target.value});},
enter:function(e){if(e.key==='Enter'){e.preventDefault();addText(s.draft);}},
add:function(){addText(s.draft);},
paste:function(){var lines=['Reply to the landlord 15m #home','Prep slides for Monday 1h #work','Order school shoes 10m #kids'];var n=s.n;var add=lines.map(function(l){n+=1;return parse(l,n);});self.setState({tasks:s.tasks.concat(add),n:n,toast:'Added 3 tasks from your list'});},
plan:function(){self.setState({times:true,toast:'Times fitted from 9:00 in this order · hold and drag to change it'});},
toast:s.toast,
sheet:cur?{title:cur.title,time:s.times?fmt(curStart):'Any time',len:fmt(cur.len),area:cur.area}:null,
moves:[['Tomorrow','Moved to Monday'],['Next week','Moved to next Monday'],['Pick a day','Pick a day…'],['Someday','Moved to Someday']].map(function(m){return {name:m[0],go:function(){if(m[0]==='Pick a day'){self.setState({toast:'Opens the date picker'});return;}leave(m[1]+' · Undo');}};}),
actions:['Set a time','Change length','Repeat','Duplicate','Link to a goal','Add to calendar'].map(function(a){return {name:a,go:function(){if(a==='Duplicate'){var n=s.n+1;self.setState({tasks:s.tasks.concat([Object.assign({},cur,{id:n,done:false})]),n:n,open:null,toast:'Duplicated'});return;}self.setState({toast:a+' · opens its picker'});}};}),
sheetDel:function(){leave('Deleted · Undo');},
sheetClose:function(){self.setState({open:null});}
};
}
}
</script>
</body>
</html>
