<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.sh{animation:sheet .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.in{animation:fadeup .28s cubic-bezier(.2,.8,.2,1) both}
button{cursor:pointer;font-family:DM Sans,sans-serif}
@media (prefers-reduced-motion:reduce){.sh,.in{animation:none}}
</style>
</helmet>
<div style="width:390px;height:1000px;box-sizing:border-box;background:#000;color:#ededed;font-family:DM Sans,system-ui,sans-serif;position:relative;overflow:hidden">
<div style="padding:16px;display:flex;flex-direction:column;gap:6px;opacity:.35">
<div style="font-size:28px;font-weight:700">Sunday</div><div style="font-size:15px;color:#8f897f">8 November</div>
<div style="height:6px;border-radius:3px;background:#1d1d20;margin-top:10px"></div>
<div style="font-size:16px;padding:18px 0 0">Complete feedbacks</div>
<div style="font-size:16px;padding:18px 0 0">Review plan for DL</div>
</div>
<div style="position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end">
<div class="sh" style="width:100%;background:#151517;border-radius:22px 22px 0 0;padding:12px 16px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">
<div style="width:40px;height:4px;border-radius:2px;background:#3a3a3e;align-self:center"></div>
<div style="display:flex;gap:12px;align-items:center">
<button type="button" onClick="{{tick}}" aria-label="Done" style="{{tickStyle}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></button>
<span style="flex:1;font-size:20px;font-weight:600">Complete feedbacks</span>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="3"><button type="button" onClick="{{t.go}}" style="{{t.style}}"><span style="font-size:10px;letter-spacing:.12em;color:#a8a29a">{{t.k}}</span><span style="font-size:15px;font-weight:600">{{t.v}}</span></button></sc-for>
</div>
<sc-if value="{{picker}}" hint-placeholder-val="{{false}}"><div class="in" style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{picker}}" as="p" hint-placeholder-count="5"><button type="button" onClick="{{p.go}}" style="{{p.style}}">{{p.v}}</button></sc-for></div></sc-if>
<div style="font-size:11px;letter-spacing:.14em;color:#a8a29a">MOVE TO</div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
<sc-for list="{{moves}}" as="m" hint-placeholder-count="4"><button type="button" onClick="{{m.go}}" style="border:0;background:#1d1d20;color:#ededed;border-radius:14px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span style="font-size:13.5px;font-weight:600">{{m.name}}</span><span style="font-size:11px;color:#8f897f">{{m.sub}}</span></button></sc-for>
</div>
<div style="font-size:11px;letter-spacing:.14em;color:#a8a29a">MORE</div>
<div style="display:flex;flex-direction:column;background:#1a1a1d;border-radius:14px;overflow:hidden">
<sc-for list="{{actions}}" as="a" hint-placeholder-count="6">
<button type="button" onClick="{{a.go}}" style="border:0;border-bottom:1px solid #222225;background:transparent;color:#ededed;min-height:48px;padding:0 14px;display:flex;align-items:center;gap:12px;text-align:left;font-size:14.5px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9b37e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"></path></svg>
<span style="flex:1">{{a.name}}</span><span style="font-size:12.5px;color:#8f897f">{{a.val}}</span></button>
</sc-for>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
<button type="button" onClick="{{del}}" style="border:0;background:transparent;color:#e07a6b;border-radius:12px;height:46px;font-size:14px">Delete</button>
<button type="button" style="border:0;background:#c9b37e;color:#111;border-radius:12px;height:46px;font-size:14px;font-weight:600">Done</button>
</div>
<sc-if value="{{toast}}" hint-placeholder-val="{{false}}"><div class="in" style="background:#2a2721;color:#f0e6cf;border-radius:12px;padding:10px 12px;font-size:13px">{{toast}}</div></sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
constructor(p){super(p);this.state={done:false,time:'9:00',len:'0:30',area:'Work',pick:null,toast:''};}
renderVals(){
var s=this.state,self=this;
var opts={time:['Any time','9:00','9:30','10:00','14:00'],len:['0:15','0:30','0:45','1:00','2:00'],area:['Work','Home','Kids','Car','Personal']};
var tile=function(k,key,v){var on=s.pick===key;return {k:k,v:v,go:function(){self.setState({pick:on?null:key});},style:'border:0;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;'+(on?'background:#2a2721;color:#f0e6cf':'background:#1d1d20;color:#ededed')};};
return {
tickStyle:'width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;'+(s.done?'border:0;background:#c9b37e;color:#111':'border:1.5px solid #5a5650;background:transparent;color:transparent'),
tick:function(){self.setState({done:!s.done,toast:s.done?'':'Done · nice'});},
tiles:[tile('TIME','time',s.time),tile('LENGTH','len',s.len),tile('AREA','area',s.area)],
picker:s.pick?opts[s.pick].map(function(v){var cur=s[s.pick]===v;return {v:v,go:function(){var o={pick:null};o[s.pick]=v;self.setState(o);},style:'border:0;border-radius:999px;padding:8px 12px;font-size:13px;'+(cur?'background:#c9b37e;color:#111;font-weight:600':'background:#1d1d20;color:#ededed')};}):null,
moves:[['Tomorrow','Mon 9'],['Next week','Mon 16'],['Pick a day','calendar'],['Someday','no date']].map(function(m){return {name:m[0],sub:m[1],go:function(){self.setState({toast:m[0]==='Pick a day'?'Opens a month to pick from':'Moved to '+m[0]+' · Undo'});}};}),
actions:[
['Repeat','Never','M17 2l4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3'],
['Due by','None','M4 5h16v15H4zM4 10h16M9 3v4M15 3v4'],
['Add to calendar','Block 9:00–9:30','M4 5h16v15H4zM12 12v5M9.5 14.5h5'],
['Link to a goal','None','M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8'],
['Break it down','Obi suggests steps','M5 6h14M5 12h10M5 18h6'],
['Duplicate','','M8 8h12v12H8zM4 16V4h12'],
['Note','Add a note','M4 4h16v12H8l-4 4z']
].map(function(a){return {name:a[0],val:a[1],icon:a[2],go:function(){self.setState({toast:a[0]+' · opens its picker'});}};}),
del:function(){self.setState({toast:'Deleted · Undo'});},
toast:s.toast
};
}
}
</script>
</body>
</html>
