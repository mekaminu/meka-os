name: fold-smoke

# Smaller phone updates (build plan): GitHub publishes the R8-shrunk `fold` build to the Fold. This builds it, reports
# its size, and opens it on an emulator for 30 s so a missing class shows up here, not as a phone MEKA can't open (and
# so can't update itself). An emulator run costs ~10 Linux minutes, so it runs when the build or shrink rules change,
# weekly and on manual dispatch (rule 10).
on:
  push:
    branches: [main]
    paths:
      - "android/app/build.gradle.kts"
      - "android/app/proguard-rules.pro"
      - "wear/app/build.gradle.kts"
      - "wear/app/proguard-rules.pro"
      - "android/app/src/main/AndroidManifest.xml"
      - "gradle/libs.versions.toml"
      - ".github/workflows/fold-smoke.yml"
      - "tools/fold-smoke.sh"
  schedule:
    - cron: "17 5 * * 0" # weekly (Sunday)
  workflow_dispatch:

concurrency:
  group: fold-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: The Fold's build (arm64) and its size
        run: |
          set -euo pipefail
          tools/ci-run.sh ./gradlew :android:app:assembleFold
          A=android/app/build/outputs/apk/fold/app-fold.apk
          echo "::notice title=Fold build size::$(stat -c %s "$A") bytes (arm64-v8a, R8, resources shrunk)"
      - name: The watch's shrunk build and its size (R8 must pass; installed from the Mac by tools/install-watch.sh)
        run: |
          set -euo pipefail
          tools/ci-run.sh ./gradlew :wear:app:assembleWatch
          W=wear/app/build/outputs/apk/watch/app-watch.apk
          D=$(stat -c %s "$W")
          echo "::notice title=Watch build size::$D bytes (Arm, R8, resources shrunk)"
      - name: The same build for the emulator (x86_64)
        run: tools/ci-run.sh ./gradlew :android:app:assembleFold -Pmeka.abi=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open MEKA on an API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: tools/fold-smoke.sh
