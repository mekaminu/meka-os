name: ci

on:
  push:
    branches: [main]
    # Docs-only commits don't spend Actions minutes, except docs/help (it generates core's HelpIndex.kt, which
    # tokens-and-infra checks with gen-help --check). Later patterns win.
    paths: ["**", "!docs/**", "!**/*.md", "docs/help/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 0" # weekly (Sunday): the macOS job runs here and on manual dispatch only

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-and-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEKA_TEST_DB_URL: jdbc:postgresql://localhost:5432/postgres
      MEKA_TEST_DB_USER: postgres
      MEKA_TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      # Not a job service container: one image that can't be pulled failed the whole job (mirror limits, 2026-10-14).
      - name: Postgres for the backend tests (image mirrors, else the runner's own)
        run: tools/ci-postgres.sh
      - name: Kernel purity (ADR-011)
        run: tools/ci-run.sh ./gradlew checkKernelPurity
      - name: Core + data + facade + backend tests
        run: tools/ci-run.sh ./gradlew :core:sync:jvmTest :core:domain:jvmTest :core:policy:jvmTest :core:wire:jvmTest :core:data:jvmTest :core:facade:jvmTest :backend:test
      # Watch face golden preview (Meka 2026-10-13 12:13): the face at the cover's 78 dp and 150 dp from WatchFaceLook,
      # as PNGs to look at by eye (the run's artifacts). An aid, so it never turns the run red.
      - name: Watch face preview
        continue-on-error: true
        run: |
          tools/render-watch-face.sh build/watch-face 78 150
          echo "Watch face preview: download the watch-face artifact (78 dp and 150 dp, plus 3× enlargements)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: watch-face, path: build/watch-face, retention-days: 14, if-no-files-found: ignore }

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit test, lint
        run: tools/ci-run.sh ./gradlew :android:app:assembleDebug :android:app:testDebugUnitTest :android:app:compileDebugAndroidTestKotlin :android:app:lintDebug :wear:app:assembleDebug :wear:app:lintDebug

  tokens-and-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Design tokens up to date + contrast gate (ADR-012)
        run: node design/generate.mjs --check
      - name: Spacing rhythm 8/16/24 on every screen (ADR-012, Calm Today)
        run: node design/rhythm-check.mjs --self-test && node design/rhythm-check.mjs
      - name: Type from MekaType tokens only on every screen (ADR-012, Calm Today)
        run: node design/type-check.mjs --self-test && node design/type-check.mjs
      - name: The app is called Navilife (no user-visible MEKA left)
        run: python3 tools/check-app-name.py --self-test && python3 tools/check-app-name.py
      - name: No personal details in the repo (rule 13; the deny list is a secret, never printed)
        env:
          PERSONAL_DENY_LIST: ${{ secrets.PERSONAL_DENY_LIST }}
        run: python3 tools/check-personal.py --self-test && python3 tools/check-personal.py
      - name: Navilife's built-in help bundled from docs/help (Ask knows how Navilife itself works)
        run: python3 tools/gen-help.py --check
      - name: Infra typecheck, invariant tests, synth (no credentials)
        working-directory: infra
        run: npm ci && npx tsc --noEmit && npx jest && npx cdk synth --quiet

  macos:
    # macOS minutes cost ~10x Linux and used up the free allowance in five days (2026-10-05): weekly and manual only
    # (ADR-011). Build runs dispatch it once a night when the day's commits touched Mac or core code (build plan rule 10).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    # The Kotlin/Native tests alone took 35 min on 2026-10-12 (the whole job 44): leave room.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native tests + XCFramework
        run: tools/ci-run.sh ./gradlew :core:sync:macosArm64Test :core:domain:macosArm64Test :core:facade:macosArm64Test :core:facade:assembleMekaKitReleaseXCFramework
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate --spec macos/project.yml
      - name: Build and test SwiftUI app
        run: tools/ci-run.sh xcodebuild -project macos/MekaOS.xcodeproj -scheme MekaOS -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO test
      # Mac presentation pass (2026-10-15): the UI checks launch the app for real, click every sidebar row and photograph
      # Today at 1440×900 and 1000 wide. They need a signed test runner, so this build is signed to run locally (ad hoc,
      # no hardened runtime: an ad-hoc app can't load its ad-hoc SQLCipher framework under library validation).
      - name: UI checks (sidebar clicks, Today's columns and screenshots)
        run: >-
          tools/ci-run.sh xcodebuild -project macos/MekaOS.xcodeproj -scheme MekaOSUI -destination 'platform=macOS,arch=arm64'
          -resultBundlePath build/mac-ui.xcresult CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= ENABLE_HARDENED_RUNTIME=NO test
      - name: Export the screenshots
        if: always()
        run: mkdir -p build/mac-screenshots && (xcrun xcresulttool export attachments --path build/mac-ui.xcresult --output-path build/mac-screenshots || true)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots
          path: build/mac-screenshots
          if-no-files-found: ignore
          retention-days: 14
