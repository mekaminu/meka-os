name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]   # docs-only commits don't spend Actions minutes
  pull_request:
  schedule:
    - cron: "17 3 * * 0" # weekly (Sunday): the macOS job runs here and on manual dispatch only

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-and-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17 # Docker Hub's official image via AWS's public mirror: unauthenticated Docker Hub pulls hit the rate limit (2026-10-09)
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MEKA_TEST_DB_URL: jdbc:postgresql://localhost:5432/postgres
      MEKA_TEST_DB_USER: postgres
      MEKA_TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Kernel purity (ADR-011)
        run: tools/ci-run.sh ./gradlew checkKernelPurity
      - name: Core + data + facade + backend tests
        run: tools/ci-run.sh ./gradlew :core:sync:jvmTest :core:domain:jvmTest :core:policy:jvmTest :core:wire:jvmTest :core:data:jvmTest :core:facade:jvmTest :backend:test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit test, lint
        run: tools/ci-run.sh ./gradlew :android:app:assembleDebug :android:app:testDebugUnitTest :android:app:compileDebugAndroidTestKotlin :android:app:lintDebug

  tokens-and-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Design tokens up to date + contrast gate (ADR-012)
        run: node design/generate.mjs --check
      - name: Spacing rhythm 8/16/24 on every screen (ADR-012, Calm Today)
        run: node design/rhythm-check.mjs --self-test && node design/rhythm-check.mjs
      - name: Type from MekaType tokens only on every screen (ADR-012, Calm Today)
        run: node design/type-check.mjs --self-test && node design/type-check.mjs
      - name: Infra typecheck, invariant tests, synth (no credentials)
        working-directory: infra
        run: npm ci && npx tsc --noEmit && npx jest && npx cdk synth --quiet

  macos:
    # macOS minutes cost ~10x Linux and used up the free allowance in five days (2026-10-05): weekly and manual only
    # (ADR-011). Build runs dispatch it once a night when the day's commits touched Mac or core code (build plan rule 10).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native tests + XCFramework
        run: tools/ci-run.sh ./gradlew :core:sync:macosArm64Test :core:domain:macosArm64Test :core:facade:macosArm64Test :core:facade:assembleMekaKitReleaseXCFramework
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate --spec macos/project.yml
      - name: Build and test SwiftUI app
        run: tools/ci-run.sh xcodebuild -project macos/MekaOS.xcodeproj -scheme MekaOS -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO test
