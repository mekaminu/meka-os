# Versions verified against official release sources on 2026-10-01 unless marked "unverified".
# Unverified pins are known-published releases chosen conservatively; Renovate will propose upgrades once CI runs.
[versions]
kotlin = "2.4.20"
agp = "9.4.0"
skie = "0.10.15"
sqldelight = "2.4.0"
ktor = "3.6.0"
compose-bom = "2026.09.00"
androidx-window = "1.5.1"
material3-adaptive = "1.3.0"
sqlcipher-android = "4.19.0"
androidx-sqlite = "2.7.0"
kotlinx-coroutines = "1.10.2"          # unverified (latest may be newer)
kotlinx-serialization = "1.9.0"        # unverified
kotlinx-datetime = "0.7.1"             # unverified
androidx-activity = "1.10.1"           # unverified
androidx-lifecycle = "2.9.0"           # unverified
androidx-work = "2.10.1"               # unverified
androidx-core = "1.16.0"               # unverified
postgres = "42.7.5"                    # unverified
hikari = "6.3.0"                       # unverified
logback = "1.5.18"                     # unverified
testcontainers = "1.21.0"              # unverified
junit5 = "5.12.2"                      # unverified
firebase-messaging = "24.1.0"           # unverified; FCM only (push wake-ups), no Analytics
wear-tiles = "1.5.0"                   # unverified here (Google Maven unreachable from the build container); CI resolves it
wear-protolayout = "1.3.0"             # unverified; the layout library tiles 1.5 is built with
wear-watchface = "1.2.1"               # unverified; complications data source
androidx-concurrent = "1.2.0"          # unverified; ListenableFuture for the tile service
awssdk = "2.29.0"                      # KMS, Secrets Manager, Polly (MEKA's voice), S3 (callers' recordings) and Transcribe (their words), URL-connection HTTP client

android-compileSdk = "37"   # required by Compose 1.12 / OkHttp 5.5 / SQLCipher 4.19 AARs; targetSdk stays 36
android-targetSdk = "36"
android-minSdk = "31"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher-android" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidx-sqlite" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
awssdk-kms = { module = "software.amazon.awssdk:kms" }
awssdk-secretsmanager = { module = "software.amazon.awssdk:secretsmanager" }
awssdk-polly = { module = "software.amazon.awssdk:polly" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }
awssdk-transcribe = { module = "software.amazon.awssdk:transcribe" }
awssdk-urlconnection = { module = "software.amazon.awssdk:url-connection-client" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3-adaptive" }
material3-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "material3-adaptive" }
androidx-window = { module = "androidx.window:window", version.ref = "androidx-window" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
wear-tiles = { module = "androidx.wear.tiles:tiles", version.ref = "wear-tiles" }
wear-protolayout = { module = "androidx.wear.protolayout:protolayout", version.ref = "wear-protolayout" }
wear-complications-data-source = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "wear-watchface" }
androidx-concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version.ref = "androidx-concurrent" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebase-messaging" }

postgres = { module = "org.postgresql:postgresql", version.ref = "postgres" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
